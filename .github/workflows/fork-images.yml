name: Fork images (Raspberry Pi)

# The images this fork's own Raspberry Pi runs: arm64 only, built natively on GitHub's arm64
# runner (no QEMU), and published to this fork's GHCR as
#   ghcr.io/<owner>/opengym-api:nutrition   the `coach` target (Claude Agent SDK included)
#   ghcr.io/<owner>/opengym-web:nutrition
# plus a `sha-<7>` tag of each, which is what a rollback pins.
#
# Never runs upstream: the job is skipped when the repository belongs to the project's owner.
on:
  push:
    branches: [feature/nutrition]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner != 'DuarteSantos8'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
            target: coach
          - image: web
            context: .
            file: ./web/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4

      - name: Names and build metadata
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          short=${GITHUB_SHA::7}
          echo "image=ghcr.io/$owner/opengym-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          # APP_BUILD shows in Settings next to the version ("1.4.1+nutrition-abc1234"), so the
          # phone can tell which build it is running.
          build-args: |
            VERSION=nutrition-${{ steps.meta.outputs.short }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            APP_BUILD=nutrition-${{ steps.meta.outputs.short }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:nutrition
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=fork-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.image }}
